; =============================================================================
; Solar Charging Station — zero-bottleneck build (Arduino Uno / ATmega328P)
; =============================================================================
; MCU rail: MT3608 -> 5V pin (5.0 V AVCC). Sense: 10k/10k after main switch.
; Wiring reference: docs/HARDWARE_WIRING.md
; =============================================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; Frank de Brabander / Marco Schwartz I2C HD44780 driver. Pinned so a future
; registry bump cannot silently change init() / backlight() semantics.
; Compatible with PCF8574 backpacks at 0x27 (fallback 0x3F in src/main.cpp).
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
